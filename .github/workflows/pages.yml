name: Deploy client to GitHub Pages

# The browser client is static files; with the direct (WebRTC) connection it needs no server
on:
  push:
    branches: [main]
    paths: ["src/Server/Server/wwwroot/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/Server/Server/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v5
